<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nerva Agent Test Page</title>
  <style>
    body { font-family: Georgia, serif; max-width: 40rem; margin: 2rem auto; padding: 0 1rem; }
    h1 { margin-bottom: 0.25rem; }
    #result { margin-top: 1.5rem; min-height: 2rem; font-weight: 600; }
    form { display: grid; gap: 0.75rem; margin-top: 1.5rem; }
    input, button { font: inherit; padding: 0.5rem 0.75rem; }
    .hidden-panel { display: none; margin-top: 1rem; padding: 1rem; border: 1px solid #ccc; }
    .hidden-panel.visible { display: block; }
  </style>
</head>
<body>
  <h1>Nerva Browser Interaction Fixture</h1>
  <p id="intro">
    This local page is for testing scrape + interact flows.
    Fill the name field, click the button, then read the dynamic result.
  </p>

  <form id="demo-form" onsubmit="return false;">
    <label>
      Name
      <input id="name-input" name="name" type="text" placeholder="Enter a name" />
    </label>
    <button id="action-button" type="button">Show greeting</button>
    <button id="next-button" type="button">Next</button>
  </form>

  <div id="result" aria-live="polite"></div>

  <div id="pricing-panel" class="hidden-panel">
    <h2>Pricing</h2>
    <ul>
      <li>Starter — $10/month</li>
      <li>Pro — $29/month</li>
      <li>Enterprise — $99/month</li>
    </ul>
    <p>Cheapest plan: Starter at $10/month.</p>
  </div>

  <script>
    const nameInput = document.getElementById('name-input');
    const actionButton = document.getElementById('action-button');
    const nextButton = document.getElementById('next-button');
    const result = document.getElementById('result');
    const pricing = document.getElementById('pricing-panel');

    actionButton.addEventListener('click', () => {
      const name = (nameInput.value || '').trim() || 'friend';
      result.textContent = 'Hello, ' + name + '! Interaction succeeded.';
    });

    nextButton.addEventListener('click', () => {
      pricing.classList.add('visible');
      result.textContent = 'Moved to pricing panel.';
    });
  </script>
</body>
</html>
